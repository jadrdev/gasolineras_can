name: gasolineras_can
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Iconos
  cupertino_icons: ^1.0.8

  # Estado / arquitectura
  bloc_test: ^10.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  formz: ^0.8.0

  # Networking & data
  http: ^1.5.0
  drift: ^2.28.2
  shared_preferences: ^2.5.3

  # Auth / backend
  supabase_flutter: ^2.10.3

  # Firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # Geo / mapas
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  map_launcher: ^4.0.2

  # UI / utilidades
  fl_chart: ^1.0.0
  flutter_local_notifications: ^19.4.1
  flutter_dotenv: ^5.1.0
  go_router: ^16.2.0
  google_fonts: ^6.3.0
  google_mobile_ads: ^5.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.2

  # NOTA: `cupertino_native` se ha eliminado a propósito — daba problemas de
  # FFI con iOS 26 (carga rota de objective_c.framework). NavigationBar de
  # Material 3 cubre el caso de uso.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - .env
